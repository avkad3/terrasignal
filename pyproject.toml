[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasignal"
version = "0.1.0"
description = "Detect meaningful change on Earth from satellite imagery"
requires-python = ">=3.11"
dependencies = [
  "pystac-client", "planetary-computer", "odc-stac", "rasterio", "rioxarray",
  "xarray", "numpy", "scipy", "scikit-image", "shapely", "pyproj", "pyyaml", "matplotlib",
]

[project.optional-dependencies]
ml = ["torch", "torchvision", "segmentation-models-pytorch", "safetensors", "huggingface_hub"]
dev = ["pytest"]

[project.scripts]
terrasignal = "terrasignal.cli:main"

[tool.setuptools]
packages = ["terrasignal"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
