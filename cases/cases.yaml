# Curated case studies. bbox = [west, south, east, north] in degrees.
# Dates are targets; the nearest same-orbit Sentinel-1 passes are used.

assam_2024:
  title: Brahmaputra floods, Assam (India)
  bbox: [92.10, 26.25, 92.50, 26.55]
  before: 2024-03-01
  after: 2024-07-04
  kind: flood

vijayawada_2024:
  title: Budameru floods, Vijayawada (India)
  bbox: [80.52, 16.45, 80.75, 16.65]
  before: 2024-08-20
  after: 2024-09-01
  kind: flood
  # Chennai (Cyclone Michaung, Dec 2023) was the original pick, but Sentinel-1
  # recorded no passes over it from 2023-11-25 to 2024-01-15.

pakistan_2022:
  title: Indus floods near Manchar Lake, Sindh (Pakistan)
  bbox: [67.55, 26.25, 68.00, 26.60]
  before: 2022-06-01
  after: 2022-08-30
  kind: flood

derna_2023:
  title: Storm Daniel dam-break flood, Derna (Libya)
  bbox: [22.55, 32.70, 22.70, 32.80]
  before: 2023-09-01
  after: 2023-09-12
  kind: flood  # flash flood in a narrow urban wadi: a deliberately hard case

wayanad_2024:
  title: Mundakkai-Chooralmala landslide, Wayanad (India)
  bbox: [76.10, 11.43, 76.20, 11.52]
  before: 2024-07-20
  after: 2024-08-01
  kind: landslide  # not a flood; checks the detector does not over-fire

emilia_2023:
  title: Emilia-Romagna floods near Lugo (Italy)
  bbox: [11.85, 44.33, 12.10, 44.50]
  before: 2023-05-01
  after: 2023-05-21
  kind: flood  # first area run through the API that no one had looked at; Italy is not in training
